<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEROX-AI | Quant Trading Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans h-full flex flex-col">

    <!-- LOGIN MODAL -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl max-w-md w-full shadow-2xl">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-sky-400 mb-1">⚡ ZEROX-AI VIP ACCESS</h2>
                <p class="text-xs text-gray-400">Enter your Gmail and VIP License Key to unlock.</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1">Gmail Address</label>
                    <input type="email" id="user-email" required placeholder="user@gmail.com" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-gray-200 focus:outline-none focus:border-sky-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1">VIP License Key</label>
                    <input type="text" id="user-key" required placeholder="ZEROX-VIP-1001" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-gray-200 focus:outline-none focus:border-sky-500 font-mono">
                </div>
                
                <div id="login-error" class="text-xs text-rose-400 font-mono hidden text-center">❌ Invalid Key or Access Blocked!</div>

                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-gray-950 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer">
                    VERIFY & LAUNCH TERMINAL
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN TERMINAL UI (HIDDEN UNTIL LOGIN) -->
    <div id="main-terminal" class="hidden h-full flex-col p-4 space-y-4">
        <header class="flex justify-between items-center border-b border-gray-800 pb-3">
            <h1 class="text-xl font-black text-sky-400">⚡ ZEROX-AI TERMINAL</h1>
            <div id="active-user-display" class="text-xs font-mono text-emerald-400">STATUS: AUTHENTICATED</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 flex-1">
            <!-- CHARTS -->
            <div class="md:col-span-3 bg-gray-900 border border-gray-800 rounded-xl p-2 min-h-[400px]">
                <div id="tradingview_chart" class="w-full h-full min-h-[400px]"></div>
            </div>

            <!-- SIGNALS PANEL -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col justify-between">
                <div>
                    <h3 class="text-xs font-bold font-mono text-sky-400 mb-2">M1 QUANT SIGNAL</h3>
                    <div class="bg-gray-950 p-4 rounded-xl border border-gray-800 text-center mb-4">
                        <span class="text-xs text-gray-400 block mb-1">PREDICTION</span>
                        <div class="text-2xl font-black text-emerald-400">STRONG BUY</div>
                    </div>
                </div>
                <div class="text-center text-xs text-gray-500 font-mono">M1 TIMEFRAME • ZEROX-AI ENGINE</div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('user-email').value;
            const key = document.getElementById('user-key').value;

            // Get saved keys from localStorage
            let storedKeys = JSON.parse(localStorage.getItem('zerox_keys')) || [
                { email: "admin@zerox.com", key: "ZEROX-ADMIN-999", status: "Active" },
                { email: "demo@gmail.com", key: "ZEROX-VIP-1001", status: "Active" }
            ];

            const found = storedKeys.find(k => k.email === email && k.key === key && k.status === 'Active');

            if (found) {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('main-terminal').classList.remove('hidden');
                document.getElementById('main-terminal').classList.add('flex');
                
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "FX:GBPUSD",
                    "interval": "1",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "container_id": "tradingview_chart"
                });
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
