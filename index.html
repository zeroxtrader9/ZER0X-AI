<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEROX-AI | M1 Forex Quant Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #f9fafb; font-family: sans-serif; }
        .active-pair { background: #1e293b !important; border-color: #38bdf8 !important; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="bg-gray-900 border-b border-gray-800 p-3 flex justify-between items-center">
        <span class="text-xl font-black text-sky-400">⚡ ZEROX-AI PRO v3.0</span>
        <div id="market-status-badge" class="px-3 py-1 text-xs font-bold rounded-full bg-rose-950 text-rose-400 border border-rose-800">
            🔴 MARKET CLOSED
        </div>
    </header>

    <!-- DASHBOARD -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- SIDEBAR (11 PAIRS) -->
        <div class="w-64 bg-gray-950 border-r border-gray-800 p-2 overflow-y-auto shrink-0">
            <div class="text-xs font-bold text-gray-400 p-2 border-b border-gray-800 mb-2">FOREX PAIRS (11 PAIRS)</div>
            <div id="pair-list" class="space-y-1"></div>
        </div>

        <!-- CENTER CHART -->
        <div class="flex-1 bg-gray-950 relative">
            <iframe id="tv-iframe" src="https://s.tradingview.com/widgetembed/?symbol=FX%3AGBPJPY&interval=1&theme=dark" class="w-full h-full border-none"></iframe>
        </div>

        <!-- RIGHT SIGNAL PANEL -->
        <div class="w-80 bg-gray-900 border-l border-gray-800 p-4 flex flex-col justify-between">
            <div>
                <div class="flex justify-between text-xs font-bold text-gray-400 mb-4 pb-2 border-b border-gray-800">
                    <span id="pair-title">GBP/JPY (M1)</span>
                    <span class="text-sky-400">Timer: <strong id="timer-text">00:59</strong></span>
                </div>

                <div class="bg-gray-950 p-4 rounded-xl border border-gray-800 text-center mb-4">
                    <span class="text-[10px] text-gray-400 font-bold uppercase">Next M1 Prediction</span>
                    <div id="signal-text" class="text-2xl font-black my-2 text-rose-500">MARKET CLOSED</div>
                    <div class="text-xs text-gray-400">Confidence: <span id="conf-text" class="text-sky-400 font-bold">0%</span></div>
                </div>

                <div class="bg-gray-950 p-3 rounded-xl border border-gray-800 text-xs text-gray-400 space-y-2">
                    <div class="font-bold text-gray-300 border-b border-gray-800 pb-1">Quant Matrix</div>
                    <div>EMA Alignment: <span class="text-gray-200">Checking...</span></div>
                    <div>RSI Momentum: <span class="text-gray-200">Checking...</span></div>
                    <div>MACD Volume: <span class="text-gray-200">Checking...</span></div>
                </div>
            </div>
            
            <div class="text-[10px] text-gray-500">🛡️ ZEROX-AI Quant Engine v3.0</div>
        </div>
    </div>

    <script>
        const pairs = [
            { symbol: "FX:GBPJPY", name: "GBP/JPY" },
            { symbol: "FX:EURJPY", name: "EUR/JPY" },
            { symbol: "FX:AUDCAD", name: "AUD/CAD" },
            { symbol: "FX:AUDCHF", name: "AUD/CHF" },
            { symbol: "FX:AUDJPY", name: "AUD/JPY" },
            { symbol: "FX:AUDUSD", name: "AUD/USD" },
            { symbol: "FX:CADCHF", name: "CAD/CHF" },
            { symbol: "FX:CHFJPY", name: "CHF/JPY" },
            { symbol: "FX:EURAUD", name: "EUR/AUD" },
            { symbol: "FX:EURCAD", name: "EUR/CAD" },
            { symbol: "FX:EURCHF", name: "EUR/CHF" }
        ];

        function renderPairs() {
            const list = document.getElementById('pair-list');
            list.innerHTML = '';
            pairs.forEach((p, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-2 rounded border border-gray-800 text-xs font-bold text-gray-200 flex justify-between ${index===0?'active-pair':''}`;
                btn.onclick = () => {
                    document.querySelectorAll('#pair-list button').forEach(b => b.classList.remove('active-pair'));
                    btn.classList.add('active-pair');
                    document.getElementById('pair-title').innerText = p.name + ' (M1)';
                    document.getElementById('tv-iframe').src = `https://s.tradingview.com/widgetembed/?symbol=${p.symbol.replace(':','%3A')}&interval=1&theme=dark`;
                };
                btn.innerHTML = `<span>${p.name}</span><span class="text-[10px] text-sky-400">M1</span>`;
                list.appendChild(btn);
            });
        }

        window.onload = renderPairs;
    </script>
</body>
</html>
