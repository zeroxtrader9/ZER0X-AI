<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEROX-AI | Master Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans p-6">

    <header class="flex justify-between items-center border-b border-gray-800 pb-4 mb-6">
        <h1 class="text-2xl font-black text-sky-400">⚡ ZEROX-AI MASTER ADMIN</h1>
        <span class="text-xs bg-emerald-950 border border-emerald-800 text-emerald-400 font-mono px-3 py-1 rounded-xl">SYSTEM READY</span>
    </header>

    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-bold text-gray-300 font-mono">VIP ACCESS KEYS MANAGEMENT</h2>
            <button onclick="addKeyPrompt()" class="bg-sky-500 hover:bg-sky-400 text-gray-950 font-bold px-3 py-1.5 rounded-lg text-xs cursor-pointer">
                + Generate New VIP Key
            </button>
        </div>

        <table class="w-full text-left text-xs font-mono">
            <thead class="bg-gray-950 text-gray-400 border-b border-gray-800">
                <tr>
                    <th class="p-3">User Email</th>
                    <th class="p-3">VIP License Key</th>
                    <th class="p-3">Status</th>
                    <th class="p-3">Action</th>
                </tr>
            </thead>
            <tbody id="keys-table" class="divide-y divide-gray-800">
            </tbody>
        </table>
    </div>

    <script>
        let defaultKeys = [
            { email: "admin@zerox.com", key: "ZEROX-ADMIN-999", status: "Active" },
            { email: "demo@gmail.com", key: "ZEROX-VIP-1001", status: "Active" }
        ];

        function getKeys() {
            let saved = localStorage.getItem('zerox_keys');
            return saved ? JSON.parse(saved) : defaultKeys;
        }

        function render() {
            const keys = getKeys();
            const tbody = document.getElementById('keys-table');
            tbody.innerHTML = '';

            keys.forEach((k, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 text-gray-200">${k.email}</td>
                    <td class="p-3 text-sky-400 font-bold">${k.key}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${k.status === 'Active' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}">${k.status}</span></td>
                    <td class="p-3">
                        <button onclick="toggleKey(${i})" class="px-2 py-1 rounded text-[10px] font-bold ${k.status === 'Active' ? 'bg-rose-900/60 text-rose-300' : 'bg-emerald-900/60 text-emerald-300'}">
                            ${k.status === 'Active' ? 'Block Access' : 'Activate Access'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            localStorage.setItem('zerox_keys', JSON.stringify(keys));
        }

        function toggleKey(i) {
            let keys = getKeys();
            keys[i].status = keys[i].status === 'Active' ? 'Blocked' : 'Active';
            localStorage.setItem('zerox_keys', JSON.stringify(keys));
            render();
        }

        function addKeyPrompt() {
            const email = prompt("Enter User Gmail:");
            if (email) {
                const randomKey = "ZEROX-VIP-" + Math.floor(1000 + Math.random() * 9000);
                let keys = getKeys();
                keys.push({ email: email, key: randomKey, status: "Active" });
                localStorage.setItem('zerox_keys', JSON.stringify(keys));
                render();
                alert(`Generated Key: ${randomKey} for ${email}`);
            }
        }

        window.onload = render;
    </script>
</body>
</html>
