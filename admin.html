<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEROX-AI | Master Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #f9fafb; font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col p-6">

    <!-- ADMIN HEADER -->
    <header class="flex justify-between items-center pb-6 border-b border-gray-800 mb-6">
        <div>
            <h1 class="text-2xl font-black text-sky-400">⚡ ZEROX-AI MASTER ADMIN PANEL</h1>
            <p class="text-xs text-gray-400">Client License Management & Control Center</p>
        </div>
        <div class="bg-gray-900 border border-gray-800 px-4 py-2 rounded-xl text-xs font-mono">
            Admin Status: <span class="text-emerald-400 font-bold">AUTHENTICATED</span>
        </div>
    </header>

    <!-- STATS OVERVIEW -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
            <span class="text-xs text-gray-400">Total Registered Clients</span>
            <div class="text-2xl font-black text-gray-100 mt-1" id="stat-total">1</div>
        </div>
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
            <span class="text-xs text-gray-400">Active Licenses</span>
            <div class="text-2xl font-black text-emerald-400 mt-1" id="stat-active">1</div>
        </div>
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
            <span class="text-xs text-gray-400">Blocked / Pending</span>
            <div class="text-2xl font-black text-rose-400 mt-1" id="stat-blocked">0</div>
        </div>
    </div>

    <!-- CLIENT MANAGEMENT TABLE -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center">
            <h2 class="text-sm font-bold text-gray-200 uppercase">Client Access Control Table</h2>
            <button onclick="addNewClientPrompt()" class="bg-sky-500 hover:bg-sky-400 text-gray-950 px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer">
                + Add New Client
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs font-mono">
                <thead class="bg-gray-950 text-gray-400 border-b border-gray-800">
                    <tr>
                        <th class="p-3">Client Email</th>
                        <th class="p-3">Access Status</th>
                        <th class="p-3">Plan Validity</th>
                        <th class="p-3">Action Controls</th>
                    </tr>
                </thead>
                <tbody id="client-table-body" class="divide-y divide-gray-800/60">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let clients = [
            { email: "admin@zerox.com", status: "Active", validity: "30 Days (VIP)" },
            { email: "client_demo@gmail.com", status: "Active", validity: "7 Days Trial" }
        ];

        function renderClients() {
            const tbody = document.getElementById('client-table-body');
            tbody.innerHTML = '';

            let activeCount = 0;
            let blockedCount = 0;

            clients.forEach((c, index) => {
                if (c.status === 'Active') activeCount++; else blockedCount++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-bold text-gray-200">${c.email}</td>
                    <td class="p-3">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${c.status === 'Active' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}">
                            ${c.status}
                        </span>
                    </td>
                    <td class="p-3 text-gray-400">${c.validity}</td>
                    <td class="p-3 space-x-2">
                        <button onclick="toggleStatus(${index})" class="px-2 py-1 rounded text-[10px] font-bold ${c.status === 'Active' ? 'bg-rose-900/60 text-rose-300 hover:bg-rose-800' : 'bg-emerald-900/60 text-emerald-300 hover:bg-emerald-800'} transition cursor-pointer">
                            ${c.status === 'Active' ? 'Block Access' : 'Activate Access'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-total').innerText = clients.length;
            document.getElementById('stat-active').innerText = activeCount;
            document.getElementById('stat-blocked').innerText = blockedCount;
        }

        function toggleStatus(index) {
            clients[index].status = clients[index].status === 'Active' ? 'Blocked' : 'Active';
            renderClients();
        }

        function addNewClientPrompt() {
            const email = prompt("Enter new client email address:");
            if (email) {
                clients.push({ email: email, status: "Active", validity: "30 Days License" });
                renderClients();
            }
        }

        window.onload = renderClients;
    </script>
</body>
</html>
